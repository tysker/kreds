# Monitoring for Kreds (ADR-0003, ADR-0004). Same project as docker-compose.yml, so it shares its network.
# Start everything:  docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Kreds only:        docker compose up -d
name: kreds

# YAML anchors only work inside one file, so the log settings are repeated here.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "kreds.service"

services:
  prometheus:
    image: prom/prometheus:v3.13.3   # LTS line
    container_name: kreds-prometheus
    labels:
      kreds.service: prometheus
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # ADR-0003: short retention
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the app running on the host (Linux; built in on macOS)
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - garage_metrics_token
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
    container_name: kreds-postgres-exporter
    labels:
      kreds.service: postgres-exporter
    logging: *default-logging
    environment:
      DATA_SOURCE_URI: "postgres:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS_FILE: /run/secrets/monitoring_db_password
    secrets:
      - monitoring_db_password
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: only Prometheus reaches it, over the Docker network (9187)

  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0   # check for a newer patch
    container_name: kreds-opensearch-exporter
    labels:
      kreds.service: opensearch-exporter
    logging: *default-logging
    command:
      - --es.uri=http://opensearch:9200
      - --es.indices          # documents and size per index (places, statistics)
    depends_on:
      opensearch:
        condition: service_healthy
    # No ports: only Prometheus reaches it, over the Docker network (9114)

  grafana:
    image: grafana/grafana:13.1.0   # OSS edition (AGPL-3.0) – never grafana-enterprise
    container_name: kreds-grafana
    labels:
      kreds.service: grafana
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Nothing leaves the machine: no usage reporting, update checks, news feed or Gravatar (US service)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 6

  loki-init:
    # One-shot: new volumes belong to root, but Loki runs as the unprivileged user 10001.
    # Hands the data volume to that user, then exits. Loki itself never runs as root.
    image: busybox:1.38.0
    container_name: kreds-loki-init
    labels:
      kreds.service: loki-init
    logging: *default-logging
    command: [ "chown", "-R", "10001:10001", "/loki" ]
    volumes:
      - loki-data:/loki
    restart: "no"

  loki:
    image: grafana/loki:3.6.0   # newest stable 3.x.y – check before committing
    container_name: kreds-loki
    labels:
      kreds.service: loki
    logging: *default-logging
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    user: "10001:10001"
    depends_on:
      loki-init:
        condition: service_completed_successfully
    # No ports: Loki has no login of its own (ADR-0004). Only Grafana and Fluent Bit reach it.

  fluent-bit:
    image: fluent/fluent-bit:5.2.0
    container_name: kreds-fluent-bit
    logging: *default-logging        # no kreds.service label → its own logs are never shipped (no loop)
    # Needs root to read Docker's log files. Mitigation: read-only mount, no ports, no other host access.
    user: "0:0"
    entrypoint: [ "/fluent-bit/bin/fluent-bit" ]
    command: [ "-c", "/fluent-bit/etc/fluent-bit.yaml" ]
    environment:
      KREDS_ENV: local               # becomes the env label; "server" later
    volumes:
      - ./monitoring/fluent-bit:/fluent-bit/etc:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/fluent-bit/state
    depends_on:
      loki:
        condition: service_started
    # No ports: Prometheus scrapes :2020 over the Docker network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  fluent-bit-state:

secrets:
  # Created from .env at start-up; mounted read-only at /run/secrets/garage_metrics_token
  garage_metrics_token:
    environment: GARAGE_METRICS_TOKEN
  monitoring_db_password:
    environment: MONITORING_DB_PASSWORD
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
