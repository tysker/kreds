info:
  name: GET /api/v1/me
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("logged in → 200", function () {
          // On failure, show Spring's reason (WWW-Authenticate) instead of just "401"
          expect(res.getStatus(), res.getHeader("www-authenticate")).to.equal(200);
        });

        test("the user id is the Keycloak sub (a UUID)", function () {
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          expect(res.getBody().userId).to.match(uuid);
        });

        test("no session cookie – the API is stateless", function () {
          expect(res.getHeader("set-cookie"), "Set-Cookie header").to.be.undefined;
        });

        test("every response carries a correlation id", function () {
          const id = res.getHeader("x-correlation-id");
          expect(id, "X-Correlation-Id header").to.be.a("string");
          expect(id).to.match(/^[A-Za-z0-9-]{8,64}$/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
