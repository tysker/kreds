info:
  name: Grafana Prometheus health
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL_GRAFANA}}datasources/uid/prometheus/health"
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
