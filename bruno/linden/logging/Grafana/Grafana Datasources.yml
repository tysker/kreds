info:
  name: Grafana Datasources
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL_GRAFANA}}datasources"
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
