info:
  name: Grafana - is healthy
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL_GRAFANA}}health"
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
