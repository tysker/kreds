info:
  name: Grafana - Linden - is it ok? (dashboard test)
  type: http
  seq: 4

http:
  method: GET
  url: "{{URL_GRAFANA}}dashboards/uid/linden-overview"
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("overview dashboard is provisioned from the repo", function () {
          const body = res.getBody();
          expect(body.dashboard.title).to.equal("Linden – is it OK?");
          expect(body.meta.provisioned, "provisioned from file").to.equal(true);
        });

        test("every panel uses a provisioned data source", function () {
          const allowed = ["prometheus", "loki"];
          const panels = res.getBody().dashboard.panels;
          expect(panels).to.not.be.empty;

          panels.forEach(function (panel) {
            expect(allowed, `data source of '${panel.title}'`).to.include(panel.datasource.uid);
          });
        });

        test("overview has no log panels and links to the logs dashboard", function () {
          const dashboard = res.getBody().dashboard;
          const logPanels = dashboard.panels.filter(panel => panel.datasource.uid === "loki");
          expect(logPanels, "log panels on the overview").to.be.empty;
          expect(dashboard.links.some(link => link.url === "/d/linden-logs"), "link to logs").to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
