info:
  name: Keycloak - privacy test
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:9090/api/v1/query?query=keycloak_user_events_total
  params:
    - name: query
      value: keycloak_user_events_total
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("keycloak login events are counted", function () {
          const result = res.getBody().data.result;
          expect(result).to.not.be.empty;
        });

        test("metric labels contain no personal data", function () {
          const allowed = ["__name__", "client_id", "error", "event", "idp", "realm", "instance", "job"];
          const series = res.getBody().data.result;

          series.forEach(function (s) {
            Object.keys(s.metric).forEach(function (label) {
              expect(allowed, `unexpected label '${label}'`).to.include(label);
            });
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
