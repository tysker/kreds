info:
  name: FluentBit - no personal data in stored lines or labels
  type: http
  seq: 2

http:
  method: GET
  url: http://127.0.0.1:3000/api/datasources/proxy/uid/loki/loki/api/v1/query_range?query={env="local"}&limit=1000&since=2m
  params:
    - name: query
      value: '{env="local"}'
      type: query
    - name: limit
      value: "1000"
      type: query
    - name: since
      value: 2m
      type: query
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;

        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("logs arrived in the last hour", function () {
          expect(res.getBody().data.result, "log streams").to.not.be.empty;
        });

        test("no stored log line contains an email address", function () {
          res.getBody().data.result.forEach(function (stream) {
            stream.values.forEach(function ([timestamp, line]) {
              expect(EMAIL.test(line), `email in ${stream.stream.service}: ${line}`).to.equal(false);
            });
          });
        });

        test("streams carry only approved labels", function () {
          const allowed = ["env", "service","detected_level"];
          res.getBody().data.result.forEach(function (stream) {
            Object.keys(stream.stream).forEach(function (label) {
              expect(allowed, `unexpected label '${label}'`).to.include(label);
            });
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
