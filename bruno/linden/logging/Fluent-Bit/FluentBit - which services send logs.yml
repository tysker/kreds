info:
  name: FluentBit - which services send logs
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:3000/api/datasources/proxy/uid/loki/loki/api/v1/label/service/values
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("keycloak and postgres logs arrive (filtered)", function () {
          const services = res.getBody().data;
          ["grafana", "keycloak", "postgres"].forEach(function (service) {
            expect(services, `service '${service}'`).to.include(service);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
