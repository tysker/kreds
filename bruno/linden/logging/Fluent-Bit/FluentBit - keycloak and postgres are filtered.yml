info:
  name: FluentBit - keycloak and postgres are filtered
  type: http
  seq: 3

http:
  method: GET
  url: http://127.0.0.1:3000/api/datasources/proxy/uid/loki/loki/api/v1/query_range?query={service=~"keycloak|postgres"}&limit=1000&since=1h
  params:
    - name: query
      value: '{service=~"keycloak|postgres"}'
      type: query
    - name: limit
      value: "1000"
      type: query
    - name: since
      value: 1h
      type: query
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const FORBIDDEN = /username=|ipAddress=|code_id=|STATEMENT:|DETAIL:/;
        const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;

        function linesOf(service) {
          return res.getBody().data.result
            .filter(stream => stream.stream.service === service)
            .flatMap(stream => stream.values.map(([timestamp, line]) => line));
        }

        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("no keycloak or postgres line contains personal data", function () {
          ["keycloak", "postgres"].forEach(function (service) {
            linesOf(service).forEach(function (line) {
              expect(FORBIDDEN.test(line), `${service}: ${line}`).to.equal(false);
              expect(EMAIL.test(line), `${service}: ${line}`).to.equal(false);
            });
          });
        });

        test("failed logins stay visible, without the username", function () {
          const loginErrors = linesOf("keycloak").filter(line => line.includes("LOGIN_ERROR"));
          expect(loginErrors, "LOGIN_ERROR lines").to.not.be.empty;
          expect(loginErrors.some(line => line.includes('error="user_not_found"'))).to.equal(true);
        });

        test("postgres errors stay visible, without the statement", function () {
          const errors = linesOf("postgres").filter(line => line.includes("ERROR:"));
          expect(errors, "postgres ERROR lines").to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
