info:
  name: Loki - return config
  type: http
  seq: 2

http:
  method: GET
  url: http://127.0.0.1:3000/api/datasources/proxy/uid/loki/config
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("loki sends no usage reports to grafana labs", function () {
          const config = String(res.getBody());
          expect(config).to.match(/reporting_enabled:\s*false/);
        });

        test("loki deletes old logs after 14 days", function () {
          const config = String(res.getBody());
          expect(config).to.match(/retention_enabled:\s*true/);
          expect(config).to.match(/retention_period:\s*(336h|2w)/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
