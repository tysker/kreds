info:
  name: Loki - is healthy
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:3000/api/datasources/proxy/uid/loki/ready
  auth:
    type: basic
    username: "{{grafanaUser}}"
    password: "{{grafanaPassword}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("loki is ready and reachable through grafana", function () {
          expect(String(res.getBody()).trim()).to.equal("ready");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
