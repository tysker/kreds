info:
  name: Postgres Exporter - exporter reaches postgres
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:9090/api/v1/query?query=pg_up
  params:
    - name: query
      value: pg_up
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("postgres exporter can log in to postgres", function () {
          const result = res.getBody().data.result;
          expect(result, "pg_up series").to.not.be.empty;

          const value = result[0].value[1];   // value = [timestamp, "1"]
          expect(value, "pg_up").to.equal("1");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
