# Prometheus scrape configuration for Linden. Targets are added one service at a time.
global:
  scrape_interval: 30s       # calm: enough for a family-sized Linden, less storage
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [ "keycloak:9000" ]

  - job_name: garage
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/garage_metrics_token
    static_configs:
      - targets: [ "garage:3903" ]

  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]

  - job_name: linden-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8081" ]   # the app runs on the host for now; later linden-app:8081

  - job_name: loki
    static_configs:
      - targets: [ "loki:3100" ]

  - job_name: fluent-bit
    metrics_path: /api/v2/metrics/prometheus
    static_configs:
      - targets: [ "fluent-bit:2020" ]
