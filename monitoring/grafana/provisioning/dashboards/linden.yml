# Dashboards as code – Grafana loads every JSON file from the mounted folder on start
# and checks it again every 30 seconds.
apiVersion: 1

providers:
  - name: linden
    folder: Linden
    type: file
    disableDeletion: true        # a dashboard is removed by deleting its file, not in the UI
    allowUiUpdates: false        # changes go through the JSON file in the repo
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
