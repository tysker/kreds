name: linden

# Shared log settings: rotate at 10 MB, keep 3 files per container.
# json-file stays the driver because log collectors read these files.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "linden.service"

services:
  postgres:
    image: postgres:17
    container_name: linden-postgres
    labels:
      linden.service: postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # Read by postgres/init/10-create-databases.sh on the first start
      LINDEN_DB_PASSWORD: ${LINDEN_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: linden-keycloak
    labels:
      linden.service: keycloak
    logging: *default-logging
    # Development mode: plain HTTP, relaxed hostname checks. A server needs production mode (start, HTTPS, hostname).
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Temporary admin for the master realm, created on the first start only
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Metrics on the management port (9000) – only reachable inside the Docker network (ADR-0003)
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      # Labels: realm and client only – never user-specific
      KC_EVENT_METRICS_USER_TAGS: "realm,clientId"
      KC_EVENT_METRICS_USER_EVENTS: "login,logout,code_to_token,refresh_token"
    ports:
      - "127.0.0.1:8180:8080"   # 8080 on the host is kept free for Spring Boot
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl, so bash talks HTTP to the management port (9000) directly
      test: [ "CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: linden-garage
    labels:
      linden.service: garage
    logging: *default-logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    ports:
      - "127.0.0.1:3900:3900"   # S3 API
      - "127.0.0.1:3903:3903"   # Admin API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

volumes:
  postgres-data:
  garage-meta:
  garage-data:
